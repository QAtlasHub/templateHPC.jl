# One file, read by all three layers:
#   ParamIO.load(this)    -> ConfigSpec      ([study], [datavault], [[paramsets]])
#   DataVault.Vault(this) -> Vault           ([study] for project_name/outdir,
#                                             [datavault] path_keys for directory names)
#   SweepRunner.run!      -> over the DataKeys ParamIO expands from it
#
# A LIST value is a swept axis; a SCALAR is fixed. In DataKey.params the entries
# appear under their DOTTED names, e.g. "system.a".

[study]
project_name  = "example"
total_samples = 3
outdir        = "out"

[datavault]
# Which params name the on-disk directory and the canonical key identity.
path_keys = ["system.a", "numerics.dt"]

[[paramsets]]

[paramsets.system]
a = [0.25, 0.5, 1.0, 2.0, 4.0]

[paramsets.numerics]
# Distinct under `%.2f`, which is what names the directory, and exact divisors of 1.0, which
# `decay_error`'s `n = round(Int, t_end/dt)` needs. A halving sequence satisfies neither.
dt = [0.1, 0.05, 0.02, 0.01]
