name: CI
on:
  push: { branches: [main], tags: ['*'] }
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# NOT the org's sharded-tests reusable, deliberately. That one shards a package's
# suite and expects TestShards in the test environment; this repository's library
# has one trivial test and would be forcing a dependency on everyone who presses
# "Use this template". What actually needs checking here is different anyway: that
# a project environment RESOLVES and that its scripts run — a green library beside
# a project that cannot instantiate would be the wrong kind of green.
#
# `setup.sh` is deliberately NOT run here. It rewrites names and re-issues UUIDs,
# which is a step the person starting a study should take knowingly rather than
# find already done for them. The cost is that its failure modes are not covered
# by CI, so a change to it has to be exercised by hand.
jobs:
  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with: { version: '1' }
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with: { version: '1' }
      - uses: julia-actions/cache@v3
      - name: Instantiate the example project
        working-directory: projects/ExampleSweep
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Its own tests
        working-directory: projects/ExampleSweep
        run: julia --project=. test/runtests.jl
      - name: The reduction both faces call
        working-directory: projects/ExampleSweep
        run: julia --project=. scripts/collect.jl out

